<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dollhouse Play World - Interactive Digital Dollhouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e0f2fe;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none;
        }

        #world-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #world-canvas.grabbing {
            cursor: grabbing;
        }

        #world-canvas.pointer-item {
            cursor: pointer;
        }

        #world-canvas.dragging-item {
            cursor: grabbing;
        }

        .hud-glass {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="relative w-full h-full overflow-hidden bg-sky-100 select-none">

    <canvas id="world-canvas"></canvas>

            <button onclick="window.camera.panToWorld(4270, 1500)" class="px-2.5 py-1.5 rounded-xl text-xs font-bold text-cyan-900 bg-cyan-100 hover:bg-cyan-200 active:scale-95 transition-all flex items-center gap-1 shrink-0">

        <div class="hud-glass hidden xl:flex pointer-events-auto items-center px-3.5 py-2 rounded-2xl text-xs font-mono text-slate-600 font-semibold shadow-sm shrink-0">
            <span id="camera-debug-info">World: 7200 x 3600</span>
        </div>
    </div>

    <!-- Interaction Tip Banner -->
    <div id="interaction-tip" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-10 hud-glass px-5 py-2 rounded-full text-xs text-slate-700 font-bold shadow-lg pointer-events-none transition-opacity duration-500 opacity-90 flex items-center gap-2 border border-white">
        <span>✨ Drag people and objects into any room! Place characters on chairs, feed them treats, dress them, or water garden plants.</span>
    </div>

    <script>
        const WORLD_WIDTH = 7200;
        const WORLD_HEIGHT = 3600;

        /**
         * CAMERA CLASS
         */
        class Camera {
            constructor(worldWidth, worldHeight) {
                this.worldWidth = worldWidth;
                this.worldHeight = worldHeight;

                this.viewportWidth = window.innerWidth;
                this.viewportHeight = window.innerHeight;

                this.x = 0;
                this.y = 0;

                this.vx = 0;
                this.vy = 0;
                this.friction = 0.92;

                this.zoom = 0.85;
                this.minZoom = 0.45;
                this.maxZoom = 1.35;

                this.isDragging = false;
                this.lastPointerX = 0;
                this.lastPointerY = 0;
                this.dragVelocities = [];

                this.targetX = null;
                this.targetY = null;

                this.centerOn(2850, 2000);
            }

            resize(width, height) {
                this.viewportWidth = width;
                this.viewportHeight = height;
                this.clamp();
            }

            centerOn(worldX, worldY) {
                const visibleWidth = this.viewportWidth / this.zoom;
                const visibleHeight = this.viewportHeight / this.zoom;

                this.x = worldX - visibleWidth / 2;
                this.y = worldY - visibleHeight / 2;
                this.clamp();
            }

            panToWorld(targetWorldX, targetWorldY) {
                const visibleWidth = this.viewportWidth / this.zoom;
                const visibleHeight = this.viewportHeight / this.zoom;

                this.targetX = targetWorldX - visibleWidth / 2;
                this.targetY = targetWorldY - visibleHeight / 2;
                this.vx = 0;
                this.vy = 0;
            }

            clamp() {
                const visibleWidth = this.viewportWidth / this.zoom;
                const visibleHeight = this.viewportHeight / this.zoom;

                if (visibleWidth >= this.worldWidth) {
                    this.x = (this.worldWidth - visibleWidth) / 2;
                } else {
                    this.x = Math.max(0, Math.min(this.x, this.worldWidth - visibleWidth));
                }

                if (visibleHeight >= this.worldHeight) {
                    this.y = (this.worldHeight - visibleHeight) / 2;
                } else {
                    this.y = Math.max(0, Math.min(this.y, this.worldHeight - visibleHeight));
                }
            }

            update() {
                if (this.targetX !== null && this.targetY !== null) {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;

                    this.x += dx * 0.12;
                    this.y += dy * 0.12;

                    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
                        this.x = this.targetX;
                        this.y = this.targetY;
                        this.targetX = null;
                        this.targetY = null;
                    }
                    this.clamp();
                    return;
                }

                if (!this.isDragging) {
                    if (Math.abs(this.vx) > 0.01 || Math.abs(this.vy) > 0.01) {
                        this.x += this.vx;
                        this.y += this.vy;

                        this.vx *= this.friction;
                        this.vy *= this.friction;

                        this.clamp();
                    } else {
                        this.vx = 0;
                        this.vy = 0;
                    }
                }
            }

            screenToWorld(screenX, screenY) {
                return {
                    x: (screenX / this.zoom) + this.x,
                    y: (screenY / this.zoom) + this.y
                };
            }

            worldToScreen(worldX, worldY) {
                return {
                    x: (worldX - this.x) * this.zoom,
                    y: (worldY - this.y) * this.zoom
                };
            }
        }

        /**
         * GAME ENTITY CLASS
         */
        class Entity {
            constructor(config) {
                this.id = config.id || 'ent_' + Math.random().toString(36).substr(2, 9);
                this.name = config.name || 'Object';
                this.type = config.type || 'object'; // 'person' | 'object'
                this.category = config.category || 'general'; // 'clothing', 'food', 'ice_cream', 'chair', 'table', 'plant', 'watering_can', 'decor', 'toy'
                this.subType = config.subType || null; // e.g. 'hat', 'shirt', 'pants', 'dress', 'shoes'
                this.x = config.x; // World X (center)
                this.y = config.y; // World Y (bottom center)
                this.w = config.w || 60; // Base Width
                this.h = config.h || 60; // Base Height
                this.draw = config.draw; // Custom Canvas render function
                this.isDragged = false;
                this.zIndex = config.zIndex || 1;
                this.scale = config.scale || 1.0;
                this.details = config.details || {};

                // Character States: 'idle', 'walking', 'sitting', 'eating', 'dragged'
                this.state = 'idle';
                this.targetX = null;
                this.targetY = null;
                this.walkSpeed = 2.8;
                this.walkCycle = 0;
                this.facingLeft = false;

                // Idle Animations
                this.blinkTimer = Math.random() * 200 + 100;
                this.isBlinking = false;
                this.blinkDuration = 0;
                this.idleBreathing = 0;

                // Sitting State
                this.isSitting = false;
                this.satChair = null;

                // Eating State
                this.eatingTimer = 0;
                this.heldFood = null;

                // Worn Items
                this.wornItems = {
                    hat: config.details?.wornHat || null,
                    shirt: config.details?.wornShirt || null,
                    pants: config.details?.wornPants || null,
                    dress: config.details?.wornDress || null,
                    shoes: config.details?.wornShoes || null
                };

                // Timers & Reaction Effects
                this.reactionTimer = 0;
                this.reactionType = null; // 'happy', 'chewing', 'watered'
                this.waterParticles = [];
            }

            containsPoint(worldX, worldY, padding = 18) {
                const left = this.x - (this.w / 2) - padding;
                const right = this.x + (this.w / 2) + padding;
                const top = this.y - this.h - padding;
                const bottom = this.y + padding;

                return worldX >= left && worldX <= right && worldY >= top && worldY <= bottom;
            }

            triggerReaction(type, duration = 120) {
                this.reactionType = type;
                this.reactionTimer = duration;
            }

            setWalkingTarget(tx, ty) {
                this.targetX = tx;
                this.targetY = ty;
                this.state = 'walking';
                if (tx < this.x) this.facingLeft = true;
                if (tx > this.x) this.facingLeft = false;
            }

            update() {
                if (this.isDragged) {
                    this.state = 'dragged';
                }

                // Reaction countdown
                if (this.reactionTimer > 0) {
                    this.reactionTimer--;
                    if (this.reactionTimer <= 0) {
                        this.reactionType = null;
                    }
                }

                // Character State Machine Logic
                if (this.type === 'person') {
                    // Blinking
                    if (this.blinkDuration > 0) {
                        this.blinkDuration--;
                        if (this.blinkDuration <= 0) this.isBlinking = false;
                    } else {
                        this.blinkTimer--;
                        if (this.blinkTimer <= 0) {
                            this.isBlinking = true;
                            this.blinkDuration = 10;
                            this.blinkTimer = Math.random() * 220 + 120;
                        }
                    }

                    // Idle Breathing
                    this.idleBreathing = Math.sin(Date.now() / 380) * 1.5;

                    // Walking State Update
                    if (this.state === 'walking' && this.targetX !== null && this.targetY !== null) {
                        const dx = this.targetX - this.x;
                        const dy = this.targetY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 4) {
                            this.x = this.targetX;
                            this.y = this.targetY;
                            this.targetX = null;
                            this.targetY = null;
                            this.state = this.isSitting ? 'sitting' : 'idle';
                            this.walkCycle = 0;
                        } else {
                            this.x += (dx / dist) * this.walkSpeed;
                            this.y += (dy / dist) * (this.walkSpeed * 0.7);
                            this.walkCycle += 0.25;
                            if (dx < 0) this.facingLeft = true;
                            if (dx > 0) this.facingLeft = false;
                        }
                    } else if (this.state === 'eating') {
                        if (this.eatingTimer > 0) {
                            this.eatingTimer--;
                            if (this.heldFood) {
                                this.heldFood.scale = Math.max(0, this.heldFood.scale - 0.012);
                            }
                            if (this.eatingTimer <= 0) {
                                this.state = 'idle';
                                this.heldFood = null;
                            }
                        }
                    }
                }

                // Water particles for watering can
                if (this.waterParticles.length > 0) {
                    for (let i = this.waterParticles.length - 1; i >= 0; i--) {
                        const p = this.waterParticles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life--;
                        if (p.life <= 0) {
                            this.waterParticles.splice(i, 1);
                        }
                    }
                }
            }
        }

        /**
         * INTERACTION MANAGER
         */
        class InteractionManager {
            constructor(entityManager) {
                this.entityManager = entityManager;
                this.rules = [];
                this.registerDefaultRules();
            }

            registerRule(sourceFilter, targetFilter, handler) {
                this.rules.push({ sourceFilter, targetFilter, handler });
            }

            registerDefaultRules() {
                // 1. Clothing -> Person Interaction
                this.registerRule(
                    (src) => src.category === 'clothing',
                    (tgt) => tgt.type === 'person',
                    (src, person) => {
                        const slot = src.subType;
                        if (!slot) return false;

                        if (slot === 'dress') {
                            if (person.wornItems.shirt) this.dropWornItem(person, 'shirt');
                            if (person.wornItems.pants) this.dropWornItem(person, 'pants');
                        } else if (slot === 'shirt' || slot === 'pants') {
                            if (person.wornItems.dress) this.dropWornItem(person, 'dress');
                        }

                        if (person.wornItems[slot]) {
                            this.dropWornItem(person, slot);
                        }

                        person.wornItems[slot] = { ...src };
                        person.triggerReaction('happy', 90);
                        this.entityManager.remove(src);
                        return true;
                    }
                );

                // 2. Person -> Chair Interaction
                this.registerRule(
                    (src) => src.type === 'person',
                    (tgt) => tgt.category === 'chair',
                    (person, chair) => {
                        person.isSitting = true;
                        person.satChair = chair;
                        person.setWalkingTarget(chair.x, chair.y - 8);
                        person.triggerReaction('happy', 60);
                        return true;
                    }
                );

                // 3. Food / Ice-Cream -> Person Interaction
                this.registerRule(
                    (src) => src.category === 'food' || src.category === 'ice_cream',
                    (tgt) => tgt.type === 'person',
                    (food, person) => {
                        person.state = 'eating';
                        person.eatingTimer = 100;
                        person.heldFood = food;
                        person.triggerReaction('chewing', 100);
                        setTimeout(() => {
                            this.entityManager.remove(food);
                        }, 1200);
                        return true;
                    }
                );

                // 4. Watering Can -> Plant Interaction
                this.registerRule(
                    (src) => src.category === 'watering_can',
                    (tgt) => tgt.category === 'plant',
                    (can, plant) => {
                        plant.triggerReaction('watered', 120);
                        for (let i = 0; i < 20; i++) {
                            can.waterParticles.push({
                                x: can.x + 18,
                                y: can.y - 22,
                                vx: (Math.random() - 0.2) * 2.5,
                                vy: Math.random() * 2 + 1,
                                life: 25 + Math.random() * 15
                            });
                        }
                        return true;
                    }
                );

                // 5. Item -> Table Interaction (Snap to surface)
                this.registerRule(
                    (src) => src.type === 'object' && src.category !== 'chair' && src.category !== 'table',
                    (tgt) => tgt.category === 'table',
                    (item, table) => {
                        item.y = table.y - table.h + 20;
                        return true;
                    }
                );
            }

            dropWornItem(person, slot) {
                const worn = person.wornItems[slot];
                if (!worn) return;

                const droppedItem = new Entity({
                    id: 'cl_' + Math.random().toString(36).substr(2, 7),
                    name: worn.name || 'Clothing Item',
                    type: 'object',
                    category: 'clothing',
                    subType: slot,
                    x: person.x + (Math.random() * 40 - 20),
                    y: person.y,
                    w: worn.w,
                    h: worn.h,
                    draw: worn.draw
                });

                person.wornItems[slot] = null;
                this.entityManager.add(droppedItem);
            }

            handleDrop(droppedEntity, releasePos) {
                const searchRadius = 110;
                let candidates = this.entityManager.getNearbyEntities(droppedEntity.x, droppedEntity.y, searchRadius, droppedEntity);

                for (let tgt of candidates) {
                    for (let rule of this.rules) {
                        if (rule.sourceFilter(droppedEntity) && rule.targetFilter(tgt)) {
                            const success = rule.handler(droppedEntity, tgt);
                            if (success) return true;
                        }
                    }
                }

                if (droppedEntity.type === 'person') {
                    const startX = droppedEntity.x - (droppedEntity.facingLeft ? -45 : 45);
                    const targetX = droppedEntity.x;
                    const targetY = droppedEntity.y;
                    droppedEntity.x = startX;
                    droppedEntity.setWalkingTarget(targetX, targetY);
                }

                return false;
            }
        }

        /**
         * INPUT CONTROLLER
         */
        class InputController {
            constructor(canvas, camera, entityManager, interactionManager) {
                this.canvas = canvas;
                this.camera = camera;
                this.entityManager = entityManager;
                this.interactionManager = interactionManager;

                this.activePointers = new Map();
                this.initialPinchDistance = null;
                this.initialZoom = 1.0;

                this.draggedEntity = null;
                this.dragOffsetX = 0;
                this.dragOffsetY = 0;

                this.initEvents();
            }

            initEvents() {
                this.canvas.addEventListener('pointerdown', (e) => {
                    this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (this.activePointers.size === 1) {
                        const worldPos = this.camera.screenToWorld(e.clientX, e.clientY);
                        const hitEntity = this.entityManager.findEntityAt(worldPos.x, worldPos.y);

                        if (hitEntity) {
                            this.draggedEntity = hitEntity;
                            hitEntity.isDragged = true;

                            if (hitEntity.isSitting) {
                                hitEntity.isSitting = false;
                                hitEntity.satChair = null;
                                hitEntity.state = 'idle';
                            }

                            this.dragOffsetX = worldPos.x - hitEntity.x;
                            this.dragOffsetY = worldPos.y - hitEntity.y;

                            this.entityManager.bringToTop(hitEntity);
                            this.canvas.classList.add('dragging-item');
                        } else {
                            this.camera.isDragging = true;
                            this.camera.targetX = null;
                            this.camera.targetY = null;
                            this.camera.vx = 0;
                            this.camera.vy = 0;
                            this.camera.lastPointerX = e.clientX;
                            this.camera.lastPointerY = e.clientY;
                            this.camera.dragVelocities = [];

                            this.canvas.classList.add('grabbing');
                        }
                    } else if (this.activePointers.size === 2) {
                        if (this.draggedEntity) {
                            this.draggedEntity.isDragged = false;
                            this.draggedEntity = null;
                        }
                        this.initialPinchDistance = this.getPointersDistance();
                        this.initialZoom = this.camera.zoom;
                    }
                });

                window.addEventListener('pointermove', (e) => {
                    if (!this.activePointers.has(e.pointerId)) {
                        const worldPos = this.camera.screenToWorld(e.clientX, e.clientY);
                        const hoverEntity = this.entityManager.findEntityAt(worldPos.x, worldPos.y);
                        if (hoverEntity && !this.camera.isDragging) {
                            this.canvas.classList.add('pointer-item');
                        } else {
                            this.canvas.classList.remove('pointer-item');
                        }
                        return;
                    }

                    this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (this.draggedEntity) {
                        const worldPos = this.camera.screenToWorld(e.clientX, e.clientY);
                        this.draggedEntity.x = Math.max(30, Math.min(WORLD_WIDTH - 30, worldPos.x - this.dragOffsetX));
                        this.draggedEntity.y = Math.max(50, Math.min(WORLD_HEIGHT - 30, worldPos.y - this.dragOffsetY));
                        return;
                    }

                    if (this.camera.isDragging && this.activePointers.size === 1) {
                        const dx = (e.clientX - this.camera.lastPointerX) / this.camera.zoom;
                        const dy = (e.clientY - this.camera.lastPointerY) / this.camera.zoom;

                        this.camera.x -= dx;
                        this.camera.y -= dy;

                        this.camera.dragVelocities.push({ dx: -dx, dy: -dy, time: performance.now() });
                        if (this.camera.dragVelocities.length > 5) {
                            this.camera.dragVelocities.shift();
                        }

                        this.camera.lastPointerX = e.clientX;
                        this.camera.lastPointerY = e.clientY;
                        this.camera.clamp();
                    }

                    if (this.activePointers.size === 2 && this.initialPinchDistance) {
                        const currentDistance = this.getPointersDistance();
                        const scale = currentDistance / this.initialPinchDistance;
                        let newZoom = this.initialZoom * scale;
                        newZoom = Math.max(this.camera.minZoom, Math.min(newZoom, this.camera.maxZoom));

                        const mid = this.getPointersMidpoint();
                        const worldBefore = this.camera.screenToWorld(mid.x, mid.y);
                        this.camera.zoom = newZoom;
                        const worldAfter = this.camera.screenToWorld(mid.x, mid.y);

                        this.camera.x += (worldBefore.x - worldAfter.x);
                        this.camera.y += (worldBefore.y - worldAfter.y);
                        this.camera.clamp();
                    }
                });

                const endHandler = (e) => {
                    if (this.activePointers.has(e.pointerId)) {
                        this.activePointers.delete(e.pointerId);
                    }

                    if (this.draggedEntity) {
                        const releasedEntity = this.draggedEntity;
                        releasedEntity.isDragged = false;
                        this.draggedEntity = null;
                        this.canvas.classList.remove('dragging-item');

                        this.interactionManager.handleDrop(releasedEntity, { x: releasedEntity.x, y: releasedEntity.y });
                    }

                    if (this.activePointers.size < 2) {
                        this.initialPinchDistance = null;
                    }

                    if (this.activePointers.size === 0 && this.camera.isDragging) {
                        this.camera.isDragging = false;
                        this.canvas.classList.remove('grabbing');

                        const vels = this.camera.dragVelocities;
                        if (vels.length >= 2) {
                            let totalDx = 0;
                            let totalDy = 0;
                            for (let i = 1; i < vels.length; i++) {
                                totalDx += vels[i].dx;
                                totalDy += vels[i].dy;
                            }

                            this.camera.vx = (totalDx / vels.length) * 1.2;
                            this.camera.vy = (totalDy / vels.length) * 1.2;
                        }
                    }
                };

                window.addEventListener('pointerup', endHandler);
                window.addEventListener('pointercancel', endHandler);

                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                    let newZoom = this.camera.zoom * zoomFactor;
                    newZoom = Math.max(this.camera.minZoom, Math.min(newZoom, this.camera.maxZoom));

                    const worldBefore = this.camera.screenToWorld(e.clientX, e.clientY);
                    this.camera.zoom = newZoom;
                    const worldAfter = this.camera.screenToWorld(e.clientX, e.clientY);

                    this.camera.x += (worldBefore.x - worldAfter.x);
                    this.camera.y += (worldBefore.y - worldAfter.y);
                    this.camera.clamp();
                }, { passive: false });
            }

            getPointersDistance() {
                const pts = Array.from(this.activePointers.values());
                const dx = pts[0].x - pts[1].x;
                const dy = pts[0].y - pts[1].y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            getPointersMidpoint() {
                const pts = Array.from(this.activePointers.values());
                return {
                    x: (pts[0].x + pts[1].x) / 2,
                    y: (pts[0].y + pts[1].y) / 2
                };
            }
        }

         * ENTITY MANAGER & POPULATION
         */
        class EntityManager {
            constructor() {
                this.entities = [];
                this.populateWorld();
            }

            add(entity) {
                this.entities.push(entity);
            }

            remove(entity) {
                const index = this.entities.indexOf(entity);
                if (index > -1) {
                    this.entities.splice(index, 1);
                }
            }

            bringToTop(entity) {
                const index = this.entities.indexOf(entity);
                if (index > -1) {
                    this.entities.splice(index, 1);
                    this.entities.push(entity);
                }
            }

            findEntityAt(worldX, worldY) {
                for (let i = this.entities.length - 1; i >= 0; i--) {
                    if (this.entities[i].containsPoint(worldX, worldY)) {
                        return this.entities[i];
                    }
                }
                return null;
            }

            getNearbyEntities(worldX, worldY, radius, excludeEntity = null) {
                return this.entities.filter(ent => {
                    if (ent === excludeEntity) return false;
                    const dx = ent.x - worldX;
                    const dy = ent.y - worldY;
                    return Math.sqrt(dx * dx + dy * dy) <= radius;
                });
            }

            drawPerson(ctx, ent) {
                const d = ent.details;
                const w = ent.w;
                const h = ent.h;
                const isSitting = ent.isSitting;
                const isWalking = ent.state === 'walking';

                ctx.save();
                if (ent.facingLeft) {
                    ctx.scale(-1, 1);
                }

                const walkYOffset = isWalking ? Math.abs(Math.sin(ent.walkCycle)) * -6 : 0;
                const idleYOffset = (ent.state === 'idle') ? ent.idleBreathing : 0;
                const totalY = walkYOffset + idleYOffset;

                ctx.translate(0, totalY);

                const bodyY = isSitting ? -h + 48 : -h + 38;
                const bodyH = isSitting ? h - 60 : h - 50;

                // Head
                ctx.fillStyle = d.skin;
                ctx.beginPath();
                ctx.arc(0, -h + 20, 18, 0, Math.PI * 2);
                ctx.fill();

                // Eyes with Blinking
                ctx.fillStyle = '#0f172a';
                if (ent.isBlinking) {
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-9, -h + 18); ctx.lineTo(-3, -h + 18);
                    ctx.moveTo(3, -h + 18); ctx.lineTo(9, -h + 18);
                    ctx.stroke();
                } else if (ent.reactionType === 'happy') {
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(-6, -h + 18, 3, Math.PI, 0);
                    ctx.arc(6, -h + 18, 3, Math.PI, 0);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(-6, -h + 18, 2.5, 0, Math.PI * 2);
                    ctx.arc(6, -h + 18, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Mouth
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (ent.state === 'eating' || ent.reactionType === 'chewing') {

            { id: 'library', name: '📚 Reading Library', x: 3200, y: 1200, w: 650, h: 600, floor: 2, bg: '#fef08a', type: 'library' },
            { id: 'living_room', name: '🛋️ Living Room', x: 2450, y: 1800, w: 800, h: 600, floor: 1, bg: '#fed7aa', type: 'living' },
            { id: 'music_room', name: '🎵 Music Room', x: 3250, y: 1800, w: 600, h: 600, floor: 1, bg: '#ccfbf1', type: 'music' },
            { id: 'grand_hall', name: '🏰 Grand Entrance', x: 2450, y: 2400, w: 600, h: 700, floor: 0, bg: '#fae8ff', type: 'hall' },
            { id: 'dining_room', name: '🍽️ Dining Room', x: 3050, y: 2400, w: 800, h: 700, floor: 0, bg: '#fef3c7', type: 'dining' },
            { id: 'art_loft', name: '🎨 Art & Craft Loft', x: 3850, y: 600, w: 850, h: 600, floor: 3, bg: '#fae8ff', type: 'art' },
            { id: 'nursery', name: '🧸 Nursery & Toys', x: 3850, y: 1200, w: 850, h: 600, floor: 2, bg: '#bae6fd', type: 'nursery' },
            { id: 'kitchen', name: '🍳 Kitchen & Pantry', x: 3850, y: 1800, w: 850, h: 600, floor: 1, bg: '#fde68a', type: 'kitchen' },
            { id: 'cafe_bakery', name: '🧁 Play Cafe', x: 3850, y: 2400, w: 850, h: 700, floor: 0, bg: '#ffe4e6', type: 'cafe' },
            { id: 'sunroom', name: '☀️ Sunroom & Plants', x: 4700, y: 1800, w: 750, h: 600, floor: 1, bg: '#dcfce7', type: 'sunroom' },
            { id: 'workshop', name: '🛠️ Toy Workshop', x: 4700, y: 2400, w: 750, h: 700, floor: 0, bg: '#e2e8f0', type: 'workshop' },
            { id: 'potting_shed', name: '🪴 Garden Shed', x: 5450, y: 2400, w: 650, h: 700, floor: 0, bg: '#d97706', type: 'shed' }
        ];

        /**
         * WORLD RENDERER CLASS
         */
        class WorldRenderer {
            constructor(canvas, entityManager) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.entityManager = entityManager;
            }

            render(camera) {
                const ctx = this.ctx;

                ctx.save();
                ctx.fillStyle = '#bae6fd';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                ctx.scale(camera.zoom, camera.zoom);
                ctx.translate(-camera.x, -camera.y);

                this.drawEnvironmentBackground(ctx);
                this.drawGroundBase(ctx);
                this.drawStreetZone(ctx);
                this.drawEastGardenZone(ctx);
                this.drawBuildingStructure(ctx);
                this.drawCirculationStairs(ctx);
                this.drawRoofsAndBalconies(ctx);
                this.drawRoomLabels(ctx);

                this.entityManager.updateAll();
                this.drawEntities(ctx);

                ctx.restore();
            }

            drawEnvironmentBackground(ctx) {
                ctx.fillStyle = '#7dd3fc';
                ctx.fillRect(0, 0, WORLD_WIDTH, 2400);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const clouds = [
                    {x: 600, y: 300, r: 80}, {x: 1800, y: 250, r: 110},
                    {x: 3400, y: 180, r: 90}, {x: 4900, y: 320, r: 120},
                    {x: 6200, y: 220, r: 100}
                ];
                clouds.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.arc(c.x + c.r * 0.7, c.y - c.r * 0.2, c.r * 0.8, 0, Math.PI * 2);
                    ctx.arc(c.x - c.r * 0.7, c.y - c.r * 0.1, c.r * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.fillStyle = '#86efac';
                ctx.beginPath();
                ctx.ellipse(1200, 2600, 1600, 600, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4ade80';
                ctx.beginPath();
                ctx.ellipse(5800, 2600, 1800, 700, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            drawGroundBase(ctx) {
                ctx.fillStyle = '#78350f';
                ctx.fillRect(0, 3100, WORLD_WIDTH, 500);

                ctx.fillStyle = '#92400e';
                for (let x = 100; x < WORLD_WIDTH; x += 300) {
                    ctx.beginPath();
                    ctx.arc(x, 3250 + (x % 70), 18, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#22c55e';
                ctx.fillRect(0, 3080, WORLD_WIDTH, 30);
            }

            drawStreetZone(ctx) {
                ctx.fillStyle = '#475569';
                ctx.fillRect(0, 2800, 1100, 300);

                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(0, 2750, 1100, 50);

                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 8;
                ctx.setLineDash([40, 30]);
                ctx.beginPath();
                ctx.moveTo(0, 2950);
                ctx.lineTo(1100, 2950);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(150, 2820, 500, 130);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.strokeRect(150, 2820, 500, 130);

                ctx.fillStyle = '#fef08a';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🍦 ICE-CREAM VAN PARKING SPOT', 400, 2895);
            }

            drawEastGardenZone(ctx) {
                const startX = 6100;

                ctx.fillStyle = '#4ade80';
                ctx.fillRect(startX, 2600, 1100, 500);

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.ellipse(startX + 450, 2850, 220, 90, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            drawBuildingStructure(ctx) {
                const wallColor = '#334155';
                const slabColor = '#e2e8f0';

                ROOMS_DATA.forEach(r => {
                    // Room Shadow & Wall Background
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
                    ctx.fillRect(r.x + 8, r.y + 8, r.w, r.h);

                    ctx.fillStyle = r.bg;
                    ctx.fillRect(r.x, r.y, r.w, r.h);

                    // Custom Environmental Room Backdrops
                    this.drawRoomInteriorDetails(ctx, r);

                    ctx.strokeStyle = wallColor;
                    ctx.lineWidth = 12;
                    ctx.strokeRect(r.x, r.y, r.w, r.h);

                    ctx.fillStyle = slabColor;
                    ctx.fillRect(r.x, r.y + r.h - 16, r.w, 16);
                });
            }

            drawRoomInteriorDetails(ctx, r) {
                ctx.save();

                // Windows, Curtains & Pictures based on room type
                if (r.type === 'observatory') {
                    // Starry background pattern
                    ctx.fillStyle = '#fef08a';
                    const stars = [{x: 100, y: 100}, {x: 250, y: 150}, {x: 450, y: 80}, {x: 600, y: 180}];
                    stars.forEach(s => { ctx.beginPath(); ctx.arc(r.x + s.x, r.y + s.y, 3, 0, Math.PI * 2); ctx.fill(); });
                } else if (r.type === 'bedroom') {
                    // Window with pink curtains
                    ctx.fillStyle = '#93c5fd'; ctx.fillRect(r.x + 400, r.y + 120, 120, 160);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.strokeRect(r.x + 400, r.y + 120, 120, 160);
                    ctx.fillStyle = '#f472b6'; ctx.fillRect(r.x + 380, r.y + 110, 30, 180); ctx.fillRect(r.x + 510, r.y + 110, 30, 180);
                    // Framed picture
                    ctx.fillStyle = '#fef08a'; ctx.fillRect(r.x + 120, r.y + 120, 80, 60);
                    ctx.strokeStyle = '#b45309'; ctx.strokeRect(r.x + 120, r.y + 120, 80, 60);
                } else if (r.type === 'living') {
                    // Cozy Fireplace Backdrop
                    ctx.fillStyle = '#78350f'; ctx.fillRect(r.x + 500, r.y + 350, 160, 230);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(r.x + 530, r.y + 420, 100, 160);
                    ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(r.x + 580, r.y + 520, 25, 0, Math.PI * 2); ctx.fill();
                    // Rug on floor
                    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.ellipse(r.x + 320, r.y + 560, 180, 22, 0, 0, Math.PI * 2); ctx.fill();
                } else if (r.type === 'kitchen') {
                    // Kitchen Wall Tile Grid & Stove Hood
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(r.x + 50, r.y + 200, 750, 180);
                    ctx.fillStyle = '#94a3b8'; ctx.fillRect(r.x + 200, r.y + 100, 140, 120);
                } else if (r.type === 'cafe') {
                    // Striped Awning Graphics
                    ctx.fillStyle = '#ef4444';
                    for (let x = 0; x < r.w; x += 60) {
                        ctx.fillRect(r.x + x, r.y + 20, 30, 40);
                    }
                } else if (r.type === 'laundry') {
                    // Washing Machine Backdrop
                    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(r.x + 50, r.y + 380, 130, 180);
                    ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(r.x + 115, r.y + 460, 35, 0, Math.PI * 2); ctx.fill();
                } else if (r.type === 'library') {
                    // Bookshelf Background Outline
                    ctx.fillStyle = '#78350f'; ctx.fillRect(r.x + 50, r.y + 100, 220, 480);
                    ctx.fillStyle = '#3b82f6'; ctx.fillRect(r.x + 60, r.y + 120, 200, 25);
                    ctx.fillStyle = '#ef4444'; ctx.fillRect(r.x + 60, r.y + 220, 200, 25);
                    ctx.fillStyle = '#10b981'; ctx.fillRect(r.x + 60, r.y + 320, 200, 25);
                }

                ctx.restore();
            }

            drawCirculationStairs(ctx) {
                ctx.fillStyle = '#b45309';
                const stairLocations = [
                    {x: 3050, y: 2400, h: 700},
                    {x: 3200, y: 1800, h: 600},
                    {x: 3100, y: 1200, h: 600}
                ];

                stairLocations.forEach(s => {
                    const steps = 10;
                    const stepW = 120 / steps;
                    const stepH = s.h / steps;

                    for (let i = 0; i < steps; i++) {
                        ctx.fillRect(s.x + (i * stepW), s.y + s.h - ((i + 1) * stepH), stepW + 4, (i + 1) * stepH);
                    }
                });
            }

            drawRoofsAndBalconies(ctx) {
                ctx.fillStyle = '#475569';
                ctx.beginPath();
                ctx.arc(2825, 100, 380, Math.PI, 0);
                ctx.fill();

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.moveTo(1050, 1800);
                ctx.lineTo(1750, 1250);
                ctx.lineTo(2480, 1800);
                ctx.fill();
            }

            drawRoomLabels(ctx) {
                ROOMS_DATA.forEach(r => {
                    const textColor = r.darkText === false ? '#ffffff' : '#1e293b';

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
                    this.drawRoundedRect(ctx, r.x + 20, r.y + 20, Math.min(r.w - 40, 260), 44, 14, true, false);

                    ctx.fillStyle = textColor;
                    ctx.font = 'bold 16px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(r.name, r.x + 35, r.y + 48);
                });
            }

            drawEntities(ctx) {
                this.entityManager.entities.forEach(ent => {
                    ctx.save();
                    ctx.translate(ent.x, ent.y);

                    if (ent.isDragged) {
                        ctx.save();
                        ctx.scale(1.15, 1.15);
                        ctx.translate(0, -16);

                        ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
                        ctx.beginPath();
                        ctx.ellipse(0, 16, ent.w * 0.6, 10, 0, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, -ent.h / 2, Math.max(ent.w, ent.h) * 0.6, 0, Math.PI * 2);
                        ctx.stroke();

                        if (ent.draw) ent.draw(ctx, ent);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.12)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, ent.w * 0.45, 6, 0, 0, Math.PI * 2);
                        ctx.fill();

                        if (ent.draw) ent.draw(ctx, ent);
                    }

                    ctx.restore();
                });
            }

            drawRoundedRect(ctx, x, y, width, height, radius, fill, stroke) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                if (fill) ctx.fill();
                if (stroke) ctx.stroke();
            }
        }

        window.onload = () => {
            const canvas = document.getElementById('world-canvas');

            const camera = new Camera(WORLD_WIDTH, WORLD_HEIGHT);
            const entityManager = new EntityManager();
            const interactionManager = new InteractionManager(entityManager);
            const input = new InputController(canvas, camera, entityManager, interactionManager);
            const renderer = new WorldRenderer(canvas, entityManager);

            window.camera = camera;
            window.entityManager = entityManager;
            window.interactionManager = interactionManager;

            function handleResize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';

                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);

                camera.resize(window.innerWidth, window.innerHeight);
            }

            window.addEventListener('resize', handleResize);
            handleResize();

            const debugText = document.getElementById('camera-debug-info');

            function animationFrameLoop() {
                camera.update();

                if (debugText) {
                    debugText.innerText = `Cam: (${Math.round(camera.x)}, ${Math.round(camera.y)}) | Items: ${entityManager.entities.length}`;
                }

                renderer.render(camera);

                requestAnimationFrame(animationFrameLoop);
            }

            requestAnimationFrame(animationFrameLoop);
        };
    </script>
